# Temporary workflow to verify OIDC trusted publishing
# Delete this file after verification

name: Test OIDC
on:
  push:
    branches:
      - fix/ci-npm-version
jobs:
  test-publish:
    name: Test OIDC Publish (dry-run)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Publish test
        run: |
          npm install -g npm@latest
          echo "=== Before cleanup ==="
          echo "npm: $(npm --version)"
          cat "$NPM_CONFIG_USERCONFIG" 2>/dev/null || echo "no .npmrc"
          echo "NODE_AUTH_TOKEN set: ${NODE_AUTH_TOKEN:+yes}"
          echo "=== Removing auth token from .npmrc ==="
          sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          unset NODE_AUTH_TOKEN
          cat "$NPM_CONFIG_USERCONFIG"
          echo "=== Publishing ==="
          npm publish --access=public --provenance 2>&1; EXIT=$?
          echo "Exit code: $EXIT"
          exit $EXIT
