# Temporary workflow to verify OIDC trusted publishing
# Delete this file after verification

name: Test OIDC
on:
  push:
    branches:
      - fix/ci-oidc-trusted-publishing
jobs:
  test-publish:
    name: Test OIDC Publish (dry-run)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Test npm publish (dry-run)
        run: npm publish --access=public --provenance --dry-run
