# Temporary workflow to verify OIDC trusted publishing
# Delete this file after verification

name: Test OIDC
on:
  push:
    branches:
      - fix/ci-npm-version
jobs:
  test-publish:
    name: Test OIDC Publish (dry-run)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish (dry-run)
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm --version)"
          echo "NODE_AUTH_TOKEN set: ${NODE_AUTH_TOKEN:+yes}"
          echo "NPM_CONFIG_USERCONFIG: ${NPM_CONFIG_USERCONFIG:-not set}"
          npm publish --access=public --provenance --dry-run 2>&1 || true
          echo "---"
          echo "Now testing actual auth (expect version conflict if auth works):"
          npm publish --access=public --provenance 2>&1; EXIT=$?
          echo "Exit code: $EXIT"
          exit $EXIT
